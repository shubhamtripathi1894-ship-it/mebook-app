name: Build MeBook APK with Full Screen Calling

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Generate Complete Android Project
      run: |
        # 1. Directory Structure Create
        mkdir -p app/src/main/java/com/mebook/app
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/values
        mkdir -p app/src/main/res/drawable
        mkdir -p app/src/main/assets

        # 2. Copy Assets & google-services.json
        if [ -f "MeBook_x5f_Website_x5f_UID_x5f_Bridge_x5f_FIXED.html" ]; then
          cp MeBook_x5f_Website_x5f_UID_x5f_Bridge_x5f_FIXED.html app/src/main/assets/index.html
        elif [ -f "index.html" ]; then
          cp index.html app/src/main/assets/index.html
        fi

        if [ -f "google-services.json" ]; then
          cp google-services.json app/google-services.json
        fi

        # 3. Root build.gradle
        cat << 'EOF' > build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.2.2'
                classpath 'com.google.gms:google-services:4.4.1'
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        task clean(type: Delete) {
            delete rootProject.buildDir
        }
        EOF

        # 4. settings.gradle
        cat << 'EOF' > settings.gradle
        include ':app'
        rootProject.name = "MeBook"
        EOF

        # 5. gradle.properties
        cat << 'EOF' > gradle.properties
        org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
        android.useAndroidX=true
        android.enableJetifier=true
        EOF

        # 6. app/build.gradle
        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
            id 'com.google.gms.google-services'
        }

        android {
            namespace 'com.mebook.app'
            compileSdk 34

            defaultConfig {
                applicationId "com.mebook.app"
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName "1.0"
                testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
            }

            buildTypes {
                release {
                    minifyEnabled false
                    proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                }
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }

        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.11.0'
            implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
            implementation platform('com.google.firebase:firebase-bom:32.7.4')
            implementation 'com.google.firebase:firebase-messaging'
        }
        EOF

        # 7. AndroidManifest.xml (Calling + Fullscreen Permissions)
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android"
            package="com.mebook.app">

            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
            <uses-permission android:name="android.permission.CAMERA" />
            <uses-permission android:name="android.permission.RECORD_AUDIO" />
            <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
            <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
            <uses-permission android:name="android.permission.WAKE_LOCK" />
            <uses-permission android:name="android.permission.VIBRATE" />
            <uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT" />
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />

            <application
                android:allowBackup="true"
                android:icon="@mipmap/ic_launcher"
                android:label="MeBook"
                android:roundIcon="@mipmap/ic_launcher"
                android:supportsRtl="true"
                android:theme="@style/Theme.AppCompat.NoActionBar"
                android:usesCleartextTraffic="true">

                <activity
                    android:name=".MainActivity"
                    android:exported="true"
                    android:configChanges="orientation|screenSize|keyboardHidden"
                    android:windowSoftInputMode="adjustResize">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>

                <!-- WhatsApp jaisa Full Screen Call Window -->
                <activity
                    android:name=".CallActivity"
                    android:exported="true"
                    android:showWhenLocked="true"
                    android:turnScreenOn="true"
                    android:screenOrientation="portrait"
                    android:theme="@style/Theme.AppCompat.NoActionBar" />

                <service
                    android:name=".MyFirebaseMessagingService"
                    android:exported="false">
                    <intent-filter>
                        <action android:name="com.google.firebase.MESSAGING_EVENT" />
                    </intent-filter>
                </service>

            </application>
        </manifest>
        EOF

        # 8. Strings & Styles
        cat << 'EOF' > app/src/main/res/values/strings.xml
        <resources>
            <string name="app_name">MeBook</string>
        </resources>
        EOF

        # 9. Call UI Layout (Call Screen)
        cat << 'EOF' > app/src/main/res/layout/activity_call.xml
        <?xml version="1.0" encoding="utf-8"?>
        <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:background="#0D0A04"
            android:padding="24dp">

            <TextView
                android:id="@+id/tvCallType"
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
                android:layout_centerHorizontal="true"
                android:layout_marginTop="50dp"
                android:text="MeBook Incoming Call..."
                android:textColor="#F5D76E"
                android:textSize="18sp" />

            <TextView
                android:id="@+id/tvCallerName"
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
                android:layout_below="@id/tvCallType"
                android:layout_centerHorizontal="true"
                android:layout_marginTop="16dp"
                android:text="User Name"
                android:textColor="#FFFFFF"
                android:textSize="28sp"
                android:textStyle="bold" />

            <LinearLayout
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:layout_alignParentBottom="true"
                android:layout_marginBottom="40dp"
                android:orientation="horizontal"
                android:weightSum="2">

                <Button
                    android:id="@+id/btnDecline"
                    android:layout_width="0dp"
                    android:layout_height="60dp"
                    android:layout_weight="1"
                    android:layout_marginEnd="10dp"
                    android:backgroundTint="#A83232"
                    android:text="Decline"
                    android:textColor="#FFFFFF"
                    android:textSize="18sp" />

                <Button
                    android:id="@+id/btnAccept"
                    android:layout_width="0dp"
                    android:layout_height="60dp"
                    android:layout_weight="1"
                    android:layout_marginStart="10dp"
                    android:backgroundTint="#2E7D32"
                    android:text="Accept"
                    android:textColor="#FFFFFF"
                    android:textSize="18sp" />
            </LinearLayout>
        </RelativeLayout>
        EOF

        # 10. CallActivity.java
        cat << 'EOF' > app/src/main/java/com/mebook/app/CallActivity.java
        package com.mebook.app;

        import android.app.KeyguardManager;
        import android.content.Context;
        import android.content.Intent;
        import android.media.AudioAttributes;
        import android.media.MediaPlayer;
        import android.media.RingtoneManager;
        import android.net.Uri;
        import android.os.Build;
        import android.os.Bundle;
        import android.os.Vibrator;
        import android.view.WindowManager;
        import android.widget.Button;
        import android.widget.TextView;
        import androidx.appcompat.app.AppCompatActivity;

        public class CallActivity extends AppCompatActivity {
            private MediaPlayer ringtonePlayer;
            private Vibrator vibrator;

            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);

                // Wake up screen & Show when locked
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O_MR1) {
                    setShowWhenLocked(true);
                    setTurnScreenOn(true);
                    KeyguardManager km = (KeyguardManager) getSystemService(Context.KEYGUARD_SERVICE);
                    if (km != null) km.requestDismissKeyguard(this, null);
                } else {
                    getWindow().addFlags(
                        WindowManager.LayoutParams.FLAG_SHOW_WHEN_LOCKED |
                        WindowManager.LayoutParams.FLAG_DISMISS_KEYGUARD |
                        WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON |
                        WindowManager.LayoutParams.FLAG_TURN_SCREEN_ON
                    );
                }

                setContentView(R.layout.activity_call);

                String callerName = getIntent().getStringExtra("callerName");
                if (callerName == null) callerName = "Someone";

                TextView tvName = findViewById(R.id.tvCallerName);
                tvName.setText(callerName);

                Button btnDecline = findViewById(R.id.btnDecline);
                Button btnAccept = findViewById(R.id.btnAccept);

                startRing();

                btnDecline.setOnClickListener(v -> {
                    stopRing();
                    finish();
                });

                btnAccept.setOnClickListener(v -> {
                    stopRing();
                    Intent mainIntent = new Intent(CallActivity.this, MainActivity.class);
                    mainIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                    mainIntent.putExtra("acceptedCall", true);
                    startActivity(mainIntent);
                    finish();
                });
            }

            private void startRing() {
                try {
                    Uri ringtoneUri = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_RINGTONE);
                    ringtonePlayer = new MediaPlayer();
                    ringtonePlayer.setDataSource(this, ringtoneUri);
                    ringtonePlayer.setAudioAttributes(new AudioAttributes.Builder()
                            .setUsage(AudioAttributes.USAGE_NOTIFICATION_RINGTONE)
                            .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)
                            .build());
                    ringtonePlayer.setLooping(true);
                    ringtonePlayer.prepare();
                    ringtonePlayer.start();

                    vibrator = (Vibrator) getSystemService(Context.VIBRATOR_SERVICE);
                    if (vibrator != null) {
                        long[] pattern = {0, 1000, 1000};
                        vibrator.vibrate(pattern, 0);
                    }
                } catch (Exception ignored) {}
            }

            private void stopRing() {
                if (ringtonePlayer != null) {
                    try {
                        if (ringtonePlayer.isPlaying()) ringtonePlayer.stop();
                        ringtonePlayer.release();
                    } catch (Exception ignored) {}
                    ringtonePlayer = null;
                }
                if (vibrator != null) {
                    vibrator.cancel();
                }
            }

            @Override
            protected void onDestroy() {
                super.onDestroy();
                stopRing();
            }
        }
        EOF

        # 11. MyFirebaseMessagingService.java (FCM Handler)
        cat << 'EOF' > app/src/main/java/com/mebook/app/MyFirebaseMessagingService.java
        package com.mebook.app;

        import android.app.NotificationChannel;
        import android.app.NotificationManager;
        import android.app.PendingIntent;
        import android.content.Context;
        import android.content.Intent;
        import android.media.RingtoneManager;
        import android.os.Build;
        import androidx.annotation.NonNull;
        import androidx.core.app.NotificationCompat;
        import com.google.firebase.messaging.FirebaseMessagingService;
        import com.google.firebase.messaging.RemoteMessage;
        import java.util.Map;

        public class MyFirebaseMessagingService extends FirebaseMessagingService {

            @Override
            public void onNewToken(@NonNull String token) {
                super.onNewToken(token);
            }

            @Override
            public void onMessageReceived(@NonNull RemoteMessage message) {
                super.onMessageReceived(message);

                Map<String, String> data = message.getData();
                String type = data.get("type");
                String title = data.get("title");
                if (title == null && message.getNotification() != null) {
                    title = message.getNotification().getTitle();
                }
                String body = data.get("body");
                if (body == null && message.getNotification() != null) {
                    body = message.getNotification().getBody();
                }
                if (title == null) title = "MeBook";

                if ("call".equalsIgnoreCase(type)) {
                    launchIncomingCallScreen(title, body);
                } else {
                    showNormalNotification(title, body);
                }
            }

            private void launchIncomingCallScreen(String title, String body) {
                Intent callIntent = new Intent(this, CallActivity.class);
                callIntent.putExtra("callerName", title);
                callIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP);

                PendingIntent fullScreenPendingIntent = PendingIntent.getActivity(
                    this, 101, callIntent,
                    PendingIntent.FLAG_UPDATE_CURRENT | (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M ? PendingIntent.FLAG_IMMUTABLE : 0)
                );

                String channelId = "mebook_calls_v2";
                NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                    NotificationChannel chan = new NotificationChannel(channelId, "Calls", NotificationManager.IMPORTANCE_HIGH);
                    chan.setSound(RingtoneManager.getDefaultUri(RingtoneManager.TYPE_RINGTONE), null);
                    if (nm != null) nm.createNotificationChannel(chan);
                }

                NotificationCompat.Builder nb = new NotificationCompat.Builder(this, channelId)
                    .setSmallIcon(android.R.drawable.ic_menu_call)
                    .setContentTitle("Incoming MeBook Call")
                    .setContentText(title + " is calling you")
                    .setPriority(NotificationCompat.PRIORITY_MAX)
                    .setCategory(NotificationCompat.CATEGORY_CALL)
                    .setFullScreenIntent(fullScreenPendingIntent, true)
                    .setAutoCancel(true);

                if (nm != null) {
                    nm.notify(999, nb.build());
                }

                // Direct launch on supported devices
                try {
                    startActivity(callIntent);
                } catch (Exception ignored) {}
            }

            private void showNormalNotification(String title, String body) {
                String channelId = "mebook_messages";
                NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                    NotificationChannel chan = new NotificationChannel(channelId, "Messages", NotificationManager.IMPORTANCE_HIGH);
                    if (nm != null) nm.createNotificationChannel(chan);
                }

                Intent intent = new Intent(this, MainActivity.class);
                PendingIntent pi = PendingIntent.getActivity(
                    this, 0, intent,
                    PendingIntent.FLAG_UPDATE_CURRENT | (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M ? PendingIntent.FLAG_IMMUTABLE : 0)
                );

                NotificationCompat.Builder nb = new NotificationCompat.Builder(this, channelId)
                    .setSmallIcon(android.R.drawable.ic_dialog_info)
                    .setContentTitle(title)
                    .setContentText(body)
                    .setAutoCancel(true)
                    .setContentIntent(pi)
                    .setPriority(NotificationCompat.PRIORITY_HIGH);

                if (nm != null) {
                    nm.notify((int) System.currentTimeMillis(), nb.build());
                }
            }
        }
        EOF

        # 12. MainActivity.java (WebView with Fixed Google Login & Native FCM Bridge)
        cat << 'EOF' > app/src/main/java/com/mebook/app/MainActivity.java
        package com.mebook.app;

        import android.Manifest;
        import android.content.pm.PackageManager;
        import android.os.Build;
        import android.os.Bundle;
        import android.webkit.PermissionRequest;
        import android.webkit.WebChromeClient;
        import android.webkit.WebSettings;
        import android.webkit.WebView;
        import android.webkit.WebViewClient;
        import androidx.appcompat.app.AppCompatActivity;
        import androidx.core.app.ActivityCompat;
        import androidx.core.content.ContextCompat;
        import com.google.firebase.messaging.FirebaseMessaging;

        public class MainActivity extends AppCompatActivity {
            private WebView webView;

            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);

                webView = new WebView(this);
                setContentView(webView);

                requestPermissions();

                WebSettings settings = webView.getSettings();
                settings.setJavaScriptEnabled(true);
                settings.setDomStorageEnabled(true);
                settings.setDatabaseEnabled(true);
                settings.setAllowFileAccess(true);
                settings.setMediaPlaybackRequiresUserGesture(false);

                // Google Login fix: Remove '; wv' from userAgent
                String customUA = settings.getUserAgentString().replace("; wv", "");
                settings.setUserAgentString(customUA);

                webView.setWebViewClient(new WebViewClient());
                webView.setWebChromeClient(new WebChromeClient() {
                    @Override
                    public void onPermissionRequest(final PermissionRequest request) {
                        runOnUiThread(() -> request.grant(request.getResources()));
                    }
                });

                // Pass FCM Token to WebApp
                FirebaseMessaging.getInstance().getToken().addOnCompleteListener(task -> {
                    if (task.isSuccessful() && task.getResult() != null) {
                        String token = task.getResult();
                        webView.post(() -> webView.evaluateJavascript("window._fcmToken = '" + token + "';", null));
                    }
                });

                webView.loadUrl("file:///android_asset/index.html");
            }

            private void requestPermissions() {
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                    if (ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                        ActivityCompat.requestPermissions(this, new String[]{Manifest.permission.POST_NOTIFICATIONS, Manifest.permission.RECORD_AUDIO, Manifest.permission.CAMERA}, 101);
                    }
                } else {
                    ActivityCompat.requestPermissions(this, new String[]{Manifest.permission.RECORD_AUDIO, Manifest.permission.CAMERA}, 101);
                }
            }

            @Override
            public void onBackPressed() {
                if (webView.canGoBack()) {
                    webView.goBack();
                } else {
                    super.onBackPressed();
                }
            }
        }
        EOF

    - name: Grant Execute Permission to Gradle Wrapper
      run: |
        gradle wrapper
        chmod +x gradlew

    - name: Build Android Release APK
      run: ./gradlew assembleRelease --stacktrace

    - name: Upload Built APK to GitHub
      uses: actions/upload-artifact@v4
      with:
        name: MeBook-Calling-APK
        path: app/build/outputs/apk/release/*.apk
